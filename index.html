<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Haiku App (NPM)</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>

    <div class="container">
        <div class="location" id="location-text">Detecting your sky...</div>
        <div class="haiku" id="haiku-text">
            Loading words from clouds,
            Waiting for the wind to blow,
            Just a brief moment...
        </div>
        <button id="refresh-btn">Refresh Sky</button>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
